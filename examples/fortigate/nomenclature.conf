# Export synthétique — ne représente pas un firewall réel.
# Cas couverts : nom non conforme, doublon strict, orphelin,
# objet conservé par une règle désactivée, site déduit du réseau
# (à lancer avec --reseaux reseaux.exemple.csv), groupe sur deux sites.
# Noms conformes en MAJUSCULES : {SITE}_{PREFIXE}_{INTERFACE}_{DETAIL}, réseaux en
# {SITE}_NET_[V{VLAN}_]{INTERFACE} (SIEGE_NET_V10_LAN-USERS) ; services en
# SVC_{PROTOCOLE}_{PORTS}_{LIBELLE} (SVC_TCP_443_HTTPS), groupes de services et
# calendriers sans site ni interface (SG_WEB, SCH_BUREAU).

config system interface
    edit "LAN-USERS"
        set ip 10.0.0.254 255.255.255.0
        set interface "port1"
        set vlanid 10
    next
    edit "GRAS-210"
        set ip 10.210.0.254 255.255.255.0
        set interface "port1"
        set vlanid 210
    next
end

config firewall address
    edit "SIEGE_HST_DMZ_WEB-01"
        set uuid 11111111-1111-1111-1111-111111111111
        set type ipmask
        set comment "Serveur web conforme"
        set subnet 10.1.1.10 255.255.255.255
    next
    edit "Web_DMZ"
        set type ipmask
        set comment "Doublon strict du serveur web"
        set subnet 10.1.1.10 255.255.255.255
    next
    edit "web_dmz_backup"
        set type ipmask
        set comment "Meme role, autre adresse : a renommer"
        set subnet 10.1.1.20 255.255.255.255
    next
    edit "partenaire"
        set type ipmask
        set comment "Hors reseaux.csv : signale a revoir, pas de nom propose"
        set subnet 192.0.2.10 255.255.255.255
    next
    edit "srv-oublie"
        set type ipmask
        set comment "Aucune reference"
        set subnet 10.9.9.9 255.255.255.255
    next
    edit "SIEGE_HST_LAN-USERS_LEGACY"
        set type ipmask
        set comment "Utilise seulement par une regle desactivee"
        set subnet 10.0.0.50 255.255.255.255
    next
    edit "SIEGE_NET_V10_LAN-USERS"
        set type ipmask
        set comment "Reseau des postes"
        set subnet 10.0.0.0 255.255.255.0
    next
    edit "LAN Utilisateurs"
        set type ipmask
        set comment "Doublon du reseau LAN"
        set subnet 10.0.0.0 255.255.255.0
    next
    edit "Vlan210"
        set type ipmask
        set comment "Reseau du site GRAS : site et zone viennent de reseaux.csv"
        set subnet 10.210.0.0 255.255.255.0
    next
    edit "SIEGE_RNG_VPN-SSL_CLIENTS"
        set type iprange
        set start-ip 10.8.0.1
        set end-ip 10.8.0.200
    next
    edit "SIEGE_FQDN_WAN_UPDATES"
        set type fqdn
        set fqdn "updates.example.com"
    next
    edit "updates.example.com"
        set type fqdn
        set fqdn "updates.example.com"
    next
end

config firewall addrgrp
    edit "SIEGE_GRP_DMZ_WEB"
        set member "SIEGE_HST_DMZ_WEB-01"
    next
    edit "Groupe Web"
        set member "SIEGE_HST_DMZ_WEB-01"
    next
    edit "Clients web"
        set member "SIEGE_NET_V10_LAN-USERS" "Vlan210"
    next
    edit "groupe-oublie"
        set member "SIEGE_HST_LAN-USERS_LEGACY"
    next
end

config firewall service custom
    edit "SVC_TCP_443_HTTPS"
        set protocol TCP/UDP/SCTP
        set tcp-portrange 443
        set comment "HTTPS"
    next
    edit "Appli metier 8443"
        set protocol TCP/UDP/SCTP
        set tcp-portrange 8443
        set comment "Le libelle est garde : SVC_TCP_8443_APPLI-METIER"
    next
    edit "HTTPS custom"
        set protocol TCP/UDP/SCTP
        set tcp-portrange 443
        set comment "Doublon de SVC_TCP_443_HTTPS"
    next
end

config firewall service group
    edit "SG_WEB"
        set member "SVC_TCP_443_HTTPS"
    next
end

config firewall vip
    edit "SIEGE_VIP_DMZ_WEB"
        set extip 203.0.113.10
        set mappedip "SIEGE_HST_DMZ_WEB-01"
        set extintf "wan"
    next
end

config firewall ippool
    edit "SIEGE_POOL_WAN_SORTANT"
        set startip 203.0.113.20
        set endip 203.0.113.30
    next
    edit "SNAT_POOL"
        set startip 203.0.113.20
        set endip 203.0.113.30
    next
end

config firewall schedule recurring
    edit "SCH_BUREAU"
        set day monday tuesday wednesday thursday friday
        set start 08:00
        set end 18:00
    next
    edit "Bureau"
        set day monday tuesday wednesday thursday friday
        set start 08:00
        set end 18:00
    next
    edit "fenetre-oubliee"
        set day sunday
        set start 00:00
        set end 01:00
    next
end

config firewall policy
    edit 1
        set name "ALLOW_SIEGE_LAN_DMZ_HTTPS"
        set srcintf "lan"
        set dstintf "dmz"
        set srcaddr "SIEGE_NET_V10_LAN-USERS"
        set dstaddr "SIEGE_GRP_DMZ_WEB"
        set action accept
        set schedule "SCH_BUREAU"
        set service "SG_WEB"
        set nat enable
        set ippool enable
        set poolname "SIEGE_POOL_WAN_SORTANT"
        set status enable
    next
    edit 2
        set name "Acces web"
        set srcintf "lan"
        set dstintf "dmz"
        set srcaddr "SIEGE_NET_V10_LAN-USERS"
        set dstaddr "web_dmz_backup"
        set action accept
        set schedule "SCH_BUREAU"
        set service "SVC_TCP_443_HTTPS"
        set status enable
    next
    edit 3
        set name "ALLOW_SIEGE_LAN_DMZ_LEGACY"
        set srcintf "lan"
        set dstintf "dmz"
        set srcaddr "SIEGE_HST_LAN-USERS_LEGACY"
        set dstaddr "SIEGE_HST_DMZ_WEB-01"
        set action accept
        set service "SVC_TCP_443_HTTPS"
        set status disable
    next
    edit 4
        set name "ALLOW_SIEGE_VPN_LAN_HTTPS"
        set srcintf "vpn"
        set dstintf "lan"
        set srcaddr "SIEGE_RNG_VPN-SSL_CLIENTS"
        set dstaddr "SIEGE_NET_V10_LAN-USERS"
        set action accept
        set service "SVC_TCP_443_HTTPS"
        set status enable
    next
    edit 5
        set name "ALLOW_SIEGE_WAN_DMZ_HTTPS"
        set srcintf "wan"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "SIEGE_VIP_DMZ_WEB"
        set action accept
        set service "SVC_TCP_443_HTTPS"
        set status enable
    next
    edit 6
        set name "ALLOW_SIEGE_LAN_DMZ_DOUBLON"
        set srcintf "lan"
        set dstintf "dmz"
        set srcaddr "LAN Utilisateurs"
        set dstaddr "Web_DMZ" "Groupe Web"
        set action accept
        set schedule "Bureau"
        set service "HTTPS custom"
        set nat enable
        set ippool enable
        set poolname "SNAT_POOL"
        set status enable
    next
    edit 7
        set name "Clients vers web"
        set srcintf "port3"
        set dstintf "dmz"
        set srcaddr "Clients web"
        set dstaddr "SIEGE_HST_DMZ_WEB-01" "partenaire"
        set action accept
        set schedule "SCH_BUREAU"
        set service "SVC_TCP_443_HTTPS" "Appli metier 8443"
        set status enable
    next
end

config router policy
    edit 1
        set dstaddr "updates.example.com"
        set gateway 192.0.2.1
        set output-device "wan1"
    next
    edit 2
        set dstaddr "SIEGE_FQDN_WAN_UPDATES"
        set gateway 192.0.2.2
        set output-device "wan1"
    next
end
