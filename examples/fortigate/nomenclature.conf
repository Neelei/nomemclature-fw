# Export synthétique — ne représente pas un firewall réel.
# Cas couverts : nom non conforme, doublon strict, orphelin,
# objet conservé par une règle désactivée.
# Noms conformes en MAJUSCULES (convention nomenclature).

config firewall address
    edit "HST-DMZ-WEB-01"
        set uuid 11111111-1111-1111-1111-111111111111
        set type ipmask
        set comment "Serveur web conforme"
        set subnet 10.1.1.10 255.255.255.255
    next
    edit "Web_DMZ"
        set type ipmask
        set comment "Doublon strict du serveur web"
        set subnet 10.1.1.10 255.255.255.255
    next
    edit "web_dmz_backup"
        set type ipmask
        set comment "Meme role, autre adresse : a renommer"
        set subnet 10.1.1.20 255.255.255.255
    next
    edit "srv-oublie"
        set type ipmask
        set comment "Aucune reference"
        set subnet 10.9.9.9 255.255.255.255
    next
    edit "HST-LAN-LEGACY"
        set type ipmask
        set comment "Utilise seulement par une regle desactivee"
        set subnet 10.0.0.50 255.255.255.255
    next
    edit "NET-LAN-UTILISATEURS"
        set type ipmask
        set comment "Reseau des postes"
        set subnet 10.0.0.0 255.255.255.0
    next
    edit "LAN Utilisateurs"
        set type ipmask
        set comment "Doublon du reseau LAN"
        set subnet 10.0.0.0 255.255.255.0
    next
    edit "RNG-VPN-CLIENTS"
        set type iprange
        set start-ip 10.8.0.1
        set end-ip 10.8.0.200
    next
    edit "FQDN-WAN-UPDATES"
        set type fqdn
        set fqdn "updates.example.com"
    next
    edit "updates.example.com"
        set type fqdn
        set fqdn "updates.example.com"
    next
end

config firewall addrgrp
    edit "GRP-DMZ-WEB"
        set member "HST-DMZ-WEB-01"
    next
    edit "Groupe Web"
        set member "HST-DMZ-WEB-01"
    next
    edit "groupe-oublie"
        set member "HST-LAN-LEGACY"
    next
end

config firewall service custom
    edit "SVC-TCP-443"
        set protocol TCP/UDP/SCTP
        set tcp-portrange 443
        set comment "HTTPS"
    next
    edit "HTTPS custom"
        set protocol TCP/UDP/SCTP
        set tcp-portrange 443
        set comment "Doublon de SVC-TCP-443"
    next
end

config firewall service group
    edit "SGRP-DMZ-WEB"
        set member "SVC-TCP-443"
    next
end

config firewall vip
    edit "VIP-WAN-WEB"
        set extip 203.0.113.10
        set mappedip "HST-DMZ-WEB-01"
        set extintf "wan"
    next
end

config firewall ippool
    edit "POOL-WAN-SORTANT"
        set startip 203.0.113.20
        set endip 203.0.113.30
    next
    edit "SNAT_POOL"
        set startip 203.0.113.20
        set endip 203.0.113.30
    next
end

config firewall schedule recurring
    edit "SCH-LAN-BUREAU"
        set day monday tuesday wednesday thursday friday
        set start 08:00
        set end 18:00
    next
    edit "Bureau"
        set day monday tuesday wednesday thursday friday
        set start 08:00
        set end 18:00
    next
    edit "fenetre-oubliee"
        set day sunday
        set start 00:00
        set end 01:00
    next
end

config firewall policy
    edit 1
        set name "ALLOW-LAN-DMZ-HTTPS"
        set srcintf "lan"
        set dstintf "dmz"
        set srcaddr "NET-LAN-UTILISATEURS"
        set dstaddr "GRP-DMZ-WEB"
        set action accept
        set schedule "SCH-LAN-BUREAU"
        set service "SGRP-DMZ-WEB"
        set nat enable
        set ippool enable
        set poolname "POOL-WAN-SORTANT"
        set status enable
    next
    edit 2
        set name "Acces web"
        set srcintf "lan"
        set dstintf "dmz"
        set srcaddr "NET-LAN-UTILISATEURS"
        set dstaddr "web_dmz_backup"
        set action accept
        set schedule "SCH-LAN-BUREAU"
        set service "SVC-TCP-443"
        set status enable
    next
    edit 3
        set name "ALLOW-LAN-DMZ-LEGACY"
        set srcintf "lan"
        set dstintf "dmz"
        set srcaddr "HST-LAN-LEGACY"
        set dstaddr "HST-DMZ-WEB-01"
        set action accept
        set service "SVC-TCP-443"
        set status disable
    next
    edit 4
        set name "ALLOW-VPN-LAN-HTTPS"
        set srcintf "vpn"
        set dstintf "lan"
        set srcaddr "RNG-VPN-CLIENTS"
        set dstaddr "NET-LAN-UTILISATEURS"
        set action accept
        set service "SVC-TCP-443"
        set status enable
    next
    edit 5
        set name "ALLOW-WAN-DMZ-HTTPS"
        set srcintf "wan"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "VIP-WAN-WEB"
        set action accept
        set service "SVC-TCP-443"
        set status enable
    next
    edit 6
        set name "ALLOW-LAN-DMZ-DOUBLON"
        set srcintf "lan"
        set dstintf "dmz"
        set srcaddr "LAN Utilisateurs"
        set dstaddr "Web_DMZ" "Groupe Web"
        set action accept
        set schedule "Bureau"
        set service "HTTPS custom"
        set nat enable
        set ippool enable
        set poolname "SNAT_POOL"
        set status enable
    next
end

config router policy
    edit 1
        set dstaddr "updates.example.com"
        set gateway 192.0.2.1
        set output-device "wan1"
    next
    edit 2
        set dstaddr "FQDN-WAN-UPDATES"
        set gateway 192.0.2.2
        set output-device "wan1"
    next
end
